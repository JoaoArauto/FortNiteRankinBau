<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking de Baús - Fortnite Ao Vivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080a0f;
      color: #f1f3f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #11141e;
      border: 1px solid #23293b;
      padding: 32px 28px;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(250, 204, 21, 0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; font-weight: 800; color: #facc15; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    p { font-size: 14px; color: #8c93a8; line-height: 1.5; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      background: #facc15;
      color: #000;
      font-weight: 800;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="loader"></div>
    <h2>🧰 Ranking de Baús</h2>
    <p id="statusMsg">Localizando servidor ao vivo...</p>
    <div id="btnArea"></div>
  </div>

  <script>
    const TOPIC = 'chestranking_thenutellas_v1';
    const query = window.location.search || '';

    async function redirectLive() {
      try {
        const res = await fetch(`https://ntfy.sh/${TOPIC}/raw?poll=1&since=24h`);
        const text = await res.text();
        const urls = text.split(/\r?\n/).map(s => s.trim()).filter(s => s.startsWith('http'));

        if (urls.length > 0) {
          const targetUrl = urls[urls.length - 1].replace(/\/+$/, '') + query;
          document.getElementById('statusMsg').textContent = 'Conectando ao ranking ao vivo...';
          document.getElementById('btnArea').innerHTML = `<a href="${targetUrl}" class="btn">ENTRAR NO RANKING</a>`;
          window.location.replace(targetUrl);
          return;
        }
      } catch (err) {}

      document.getElementById('loader').style.display = 'none';
      document.getElementById('statusMsg').innerHTML = 'O servidor do ranking está temporariamente <b>offline</b>.<br>Assim que o jogo e o servidor iniciarem, a conexão será feita automaticamente.';
      setTimeout(redirectLive, 6000);
    }

    redirectLive();
  </script>
</body>
</html>
