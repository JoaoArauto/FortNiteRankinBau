<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking de Baús & Loja Pirata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Tema HUD Fortnite Sóbrio (Escuro translúcido + Branco/Cinza + Detalhe Ciano/Ouro discreto) */
      --hud-bg: rgba(12, 15, 22, 0.90);
      --hud-row: rgba(20, 25, 36, 0.88);
      --hud-row-hover: rgba(28, 35, 50, 0.95);
      --hud-border: rgba(255, 255, 255, 0.12);
      --hud-accent: #e2e8f0;
      --hud-highlight: #facc15;
      --hud-cyan: #38bdf8;
      --hud-green: #4ade80;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: #090b10;
      color: var(--text);
      font-family: "Barlow Condensed", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.25;
      user-select: none;
      letter-spacing: 0.02em;
    }

    body.obs-mode,
    html.obs-mode {
      background: transparent !important;
    }

    body.obs-mode .hide-obs {
      display: none !important;
    }

    .widgets-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 14px;
      padding: 14px;
      max-width: 1140px;
      margin: 0 auto;
    }

    /* Painel estilo HUD in-game discreto (canto chanfrado, fundo escuro fosco) */
    .widget-wrap {
      width: 100%;
      max-width: 530px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-top: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      padding: 13px 15px;
      backdrop-filter: blur(10px);
    }

    /* Cabeçalho limpo */
    .w-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--hud-border);
    }

    .w-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.8);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--hud-green);
      display: inline-block;
    }

    /* Contadores superiores estilo HUD de materiais */
    .w-stats-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hud-chip {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--hud-border);
      padding: 3px 8px;
      transform: skewX(-8deg);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .hud-chip b {
      color: var(--text);
      font-weight: 800;
      font-size: 15px;
    }

    /* Barra de abas */
    .w-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 10px 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--hud-border);
      color: var(--muted);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      transform: skewX(-8deg);
      cursor: pointer;
      transition: all 0.12s;
    }

    .tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.09);
    }

    .tab.active {
      background: var(--text);
      border-color: var(--text);
      color: #090b10;
      font-weight: 900;
    }

    .mini-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--hud-border);
      color: var(--text);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 9px;
      transform: skewX(-8deg);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.12s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .icon-btn.primary {
      background: rgba(250, 204, 21, 0.15);
      color: var(--hud-highlight);
      border-color: rgba(250, 204, 21, 0.4);
    }

    /* Lista de Jogadores */
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      background: var(--hud-row);
      border: 1px solid var(--hud-border);
      border-left: 4px solid rgba(255, 255, 255, 0.25);
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transform: skewX(-4deg);
      transition: all 0.12s;
    }

    .row:hover {
      background: var(--hud-row-hover);
    }

    .row.rank-1 {
      border-left-color: var(--hud-highlight);
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.10) 0%, var(--hud-row) 55%);
    }

    .row.rank-2 {
      border-left-color: #cbd5e1;
    }

    .row.rank-3 {
      border-left-color: #b45309;
    }

    .pos {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.4);
      color: var(--muted);
      border: 1px solid var(--hud-border);
    }

    .rank-1 .pos {
      background: var(--hud-highlight);
      color: #090b10;
      border-color: var(--hud-highlight);
    }

    .p-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .p-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .p-name {
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-live {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      background: rgba(74, 222, 128, 0.15);
      color: var(--hud-green);
      border: 1px solid rgba(74, 222, 128, 0.35);
      text-transform: uppercase;
    }

    .p-sub {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .p-sub b {
      color: var(--text);
      font-weight: 800;
    }

    .p-score {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .p-score .main-val {
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
      line-height: 1;
    }

    .rank-1 .p-score .main-val {
      color: var(--hud-highlight);
    }

    .p-score .sub-lbl {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Gaveta de últimas partidas */
    .drawer {
      display: none;
      background: rgba(8, 10, 15, 0.95);
      border: 1px solid var(--hud-border);
      border-top: none;
      margin: -2px 4px 4px 4px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .drawer.open {
      display: block;
    }

    .drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
    }

    .mini-table td {
      padding: 3.5px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-weight: 600;
    }

    .mini-table tr:last-child td {
      border-bottom: none;
    }

    .mini-table td.c-chests {
      text-align: right;
      color: var(--text);
      font-weight: 800;
    }

    .empty {
      text-align: center;
      padding: 20px 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .footer-bar {
      margin-top: 9px;
      padding-top: 7px;
      border-top: 1px solid var(--hud-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ==========================================
       WIDGET 2: OBJETIVO LOJA PIRATA & METAS
       ========================================== */
    .th-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      transform: skewX(-8deg);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--hud-border);
      background: rgba(0, 0, 0, 0.45);
      color: var(--muted);
    }

    .th-toggle.active {
      background: rgba(250, 204, 21, 0.16);
      color: var(--hud-highlight);
      border-color: rgba(250, 204, 21, 0.45);
    }

    /* Card Missão Principal: Loja Pirata */
    .pirate-goal-card {
      margin-top: 10px;
      background: var(--hud-row);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 4px solid var(--hud-highlight);
      padding: 10px 12px;
      transform: skewX(-3deg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .pg-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--text);
    }

    .pg-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--hud-highlight);
    }

    .pg-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid var(--hud-border);
      padding: 7px 10px;
    }

    .pg-m {
      display: flex;
      flex-direction: column;
    }

    .pg-m .val {
      font-size: 19px;
      font-weight: 900;
      color: var(--text);
    }

    .pg-m.highlight .val {
      color: var(--hud-highlight);
    }

    .pg-m .lbl {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Lista de Prêmios sóbria */
    .checklist {
      margin-top: 9px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .chk-row {
      background: var(--hud-row);
      border: 1px solid var(--hud-border);
      border-left: 3px solid rgba(255, 255, 255, 0.25);
      padding: 6.5px 10px;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      transform: skewX(-3deg);
      transition: all 0.12s;
    }

    .chk-row:hover {
      background: var(--hud-row-hover);
    }

    .chk-row.done {
      border-left-color: var(--hud-green);
      opacity: 0.68;
    }

    .chk-box {
      width: 19px;
      height: 19px;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: transparent;
    }

    .chk-row.done .chk-box {
      background: var(--hud-green);
      border-color: var(--hud-green);
      color: #090b10;
    }

    .chk-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      color: var(--text);
    }

    .chk-row.done .chk-name span.n-txt {
      text-decoration: line-through;
      color: var(--muted);
    }

    .pill {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--hud-border);
    }

    .chk-odds {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .chk-odds .o-main {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text);
    }

    .chk-odds .o-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="widgets-grid">
    <!-- WIDGET 1: RANKING AO VIVO -->
    <div class="widget-wrap" id="widgetRanking">
      <div class="w-header">
        <div class="w-title">
          <span>🧰 RANKING DE BAÚS</span>
          <span class="live-dot" title="Sincronizado ao vivo"></span>
        </div>
        <div class="w-stats-inline">
          <span class="hud-chip">TOTAL <b id="sumTotalChests">0</b></span>
          <span class="hud-chip">RECORDE <b id="sumBestMatch">0</b></span>
          <span class="hud-chip">TESOUROS <b id="sumTreasures">0</b></span>
        </div>
      </div>

      <div class="w-bar hide-obs">
        <div class="tabs">
          <button class="tab active" onclick="setSort('totalChests', this)">Total</button>
          <button class="tab" onclick="setSort('todayChests', this)">Hoje</button>
          <button class="tab" onclick="setSort('bestMatch', this)">Recorde</button>
          <button class="tab" onclick="setSort('avgChests', this)">Média</button>
          <button class="tab" onclick="setSort('treasuresCount', this)">Tesouros</button>
        </div>

        <div class="mini-actions">
          <a id="downloadBatBtn" href="/api/download-client" class="icon-btn primary" title="Baixar connectr.bat (instala e abre o ChestCounter.exe sozinho)">
            ⬇ BAIXAR CONNECTR
          </a>
          <button class="icon-btn" onclick="copyShareLink(this)" title="Copiar link">🔗</button>
          <button class="icon-btn" onclick="toggleObsMode()" title="Fundo Transparente (OBS)">🎥</button>
        </div>
      </div>

      <div id="rankingContainer" class="list">
        <div class="empty">SINCRONIZANDO DADOS...</div>
      </div>

      <div class="footer-bar hide-obs">
        <span id="statusFooter">AO VIVO</span>
        <label style="cursor:pointer; color:var(--text); font-weight:800" title="Enviar matches.csv ou data.json">
          + ENVIAR ARQUIVO
          <input type="file" id="manualFileInput" accept=".csv,.json" style="display:none" />
        </label>
      </div>
    </div>

    <!-- WIDGET 2: CHECKLIST DE PRÊMIOS & CHANCE LOJA PIRATA -->
    <div class="widget-wrap" id="widgetChecklist">
      <div class="w-header">
        <div class="w-title">
          <span>🏴‍☠️ METAS DE TESOUROS</span>
        </div>
        <button id="thBtn" class="th-toggle" onclick="toggleTreasureHour()" title="Horários automáticos: Sábados 16h–18h e 23h–01h (Clique para alternar Automático / Ligado / Desligado)">
          🔥 HORA DO TESOURO: <span id="thStatusTxt">AUTO</span>
        </button>
      </div>

      <!-- Destaque Objetivo Principal: Loja Pirata -->
      <div class="pirate-goal-card">
        <div class="pg-top">
          <div class="pg-label">
            <span>🏴‍☠️ LOJA PIRATA</span>
            <span class="pg-tag">OBJETIVO PRINCIPAL</span>
          </div>
          <span id="psOddsBadge" style="font-size:15px; font-weight:900; color:var(--text)">1 / 137.500</span>
        </div>

        <div class="pg-metrics">
          <div class="pg-m highlight">
            <span class="val" id="psNextChestPct">0,000727%</span>
            <span class="lbl" id="psNextChestLbl">CHANCE NO PRÓXIMO BAÚ</span>
          </div>
          <div class="pg-m">
            <span class="val" id="psCumulPct">0,0000%</span>
            <span class="lbl">CHANCE ACUMULADA (<span id="psChestsUsed">0</span> BAÚS)</span>
          </div>
        </div>
      </div>

      <!-- Checklist dos 7 Prêmios em Português -->
      <div id="checklistContainer" class="checklist"></div>

      <div class="footer-bar">
        <span>PRÊMIOS ÚNICOS NÃO REPETEM (EXCETO BUGIGANGA)</span>
        <span class="hide-obs">CLIQUE PARA MARCAR</span>
      </div>
    </div>
  </div>

  <script>
    let currentState = { players: [], publicUrl: null, localUrls: [], manualChecks: {}, treasureHourMode: 'auto' };
    let currentSort = 'totalChests';
    const openDetailsIds = new Set();

    // Sábados das 16:00 às 18:00 e Sábados das 23:00 às 01:00 (madrugada de Domingo)
    function getTreasureHourScheduleStatus() {
      const now = new Date();
      const day = now.getDay();
      const h = now.getHours();

      const inWindow1 = (day === 6 && h >= 16 && h < 18);
      const inWindow2 = (day === 6 && h >= 23) || (day === 0 && h < 1);

      if (inWindow1) {
        const end = new Date(now);
        end.setHours(18, 0, 0, 0);
        return { active: true, remainingMs: end - now };
      }
      if (inWindow2) {
        const end = new Date(now);
        if (day === 6) end.setDate(end.getDate() + 1);
        end.setHours(1, 0, 0, 0);
        return { active: true, remainingMs: end - now };
      }

      const candidates = [];
      for (let addDays = 0; addDays <= 7; addDays++) {
        const d1 = new Date(now);
        d1.setDate(now.getDate() + addDays);
        if (d1.getDay() === 6) {
          const w1 = new Date(d1);
          w1.setHours(16, 0, 0, 0);
          if (w1 > now) candidates.push(w1);

          const w2 = new Date(d1);
          w2.setHours(23, 0, 0, 0);
          if (w2 > now) candidates.push(w2);
        }
      }
      candidates.sort((a, b) => a - b);
      const nextStart = candidates[0];
      const diffMs = nextStart ? (nextStart - now) : 0;

      return { active: false, nextInMs: diffMs };
    }

    function formatDurationShort(ms) {
      const totalMin = Math.max(0, Math.floor(ms / 60000));
      const days = Math.floor(totalMin / 1440);
      const hours = Math.floor((totalMin % 1440) / 60);
      const mins = totalMin % 60;
      if (days > 0) return `${days}d ${hours}h`;
      if (hours > 0) return `${hours}h ${mins}m`;
      return `${mins}m`;
    }

    const PRIZE_DEFS = [
      {
        key: 'goldOutfit',
        icon: '👑',
        name: 'Traje Dourado',
        baseDenom: 1562500,
        thBoost: 10,
        canRepeat: false
      },
      {
        key: 'pirateShop',
        icon: '🏴‍☠️',
        name: 'Loja Pirata',
        baseDenom: 137500,
        thBoost: 2,
        canRepeat: false,
        isMainGoal: true
      },
      {
        key: 'vehicle',
        icon: '🚗',
        name: 'Veículo',
        baseDenom: 7813,
        thBoost: 10,
        canRepeat: false
      },
      {
        key: 'pickaxe',
        icon: '⛏️',
        name: 'Picareta',
        baseDenom: 568,
        thBoost: 1,
        canRepeat: false
      },
      {
        key: 'jamTrack',
        icon: '🎵',
        name: 'Música (Jam)',
        baseDenom: 391,
        thBoost: 1,
        canRepeat: false
      },
      {
        key: 'loadingScreen',
        icon: '🖼️',
        name: 'Tela de Carregamento',
        baseDenom: 272,
        thBoost: 1,
        canRepeat: false
      },
      {
        key: 'gizmo',
        icon: '🤖',
        name: 'Bugiganga (Gizmo)',
        baseDenom: 127,
        thBoost: 1,
        canRepeat: true
      }
    ];

    const params = new URLSearchParams(window.location.search);
    if (params.get('obs') === '1') {
      document.documentElement.classList.add('obs-mode');
      document.body.classList.add('obs-mode');
    }
    if (params.get('widget') === 'ranking') {
      document.getElementById('widgetChecklist').style.display = 'none';
    } else if (params.get('widget') === 'checklist') {
      document.getElementById('widgetRanking').style.display = 'none';
    }

    function toggleObsMode() {
      document.documentElement.classList.toggle('obs-mode');
      document.body.classList.toggle('obs-mode');
    }

    function getShareUrl() {
      if (currentState.publicUrl) return currentState.publicUrl;
      if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        return window.location.origin;
      }
      if (currentState.localUrls && currentState.localUrls.length > 0) {
        return currentState.localUrls[0];
      }
      return window.location.origin;
    }

    function copyShareLink(btn) {
      const url = getShareUrl();
      navigator.clipboard.writeText(url);
      const old = btn.textContent;
      btn.textContent = '✓';
      setTimeout(() => { btn.textContent = old; }, 1400);
    }

    function setSort(field, btnEl) {
      currentSort = field;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      render();
    }

    function toggleDetails(id) {
      if (openDetailsIds.has(id)) openDetailsIds.delete(id);
      else openDetailsIds.add(id);
      render();
    }

    async function removePlayer(e, id, name) {
      e.stopPropagation();
      if (!confirm(`Remover "${name}" do ranking?`)) return;
      await fetch(`/api/player/${encodeURIComponent(id)}`, { method: 'DELETE' });
    }

    async function toggleTreasureHour() {
      const modes = ['auto', 'on', 'off'];
      const cur = currentState.treasureHourMode || 'auto';
      const nextMode = modes[(modes.indexOf(cur) + 1) % modes.length];
      currentState.treasureHourMode = nextMode;
      render();
      await fetch('/api/checklist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ treasureHourMode: nextMode })
      });
    }

    async function togglePrizeCheck(prizeKey, currentlyChecked) {
      const nextVal = !currentlyChecked;
      if (!currentState.manualChecks) currentState.manualChecks = {};
      if (!currentState.manualChecks.global) currentState.manualChecks.global = {};
      currentState.manualChecks.global[prizeKey] = nextVal;
      render();
      await fetch('/api/checklist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId: 'global', prizeKey, checked: nextVal })
      });
    }

    const sortLabels = {
      totalChests: 'BAÚS',
      todayChests: 'HOJE',
      bestMatch: 'RECORDE',
      avgChests: 'MÉDIA',
      treasuresCount: 'TESOUROS'
    };

    function renderChecklist(players, totalChests) {
      const sched = getTreasureHourScheduleStatus();
      const mode = currentState.treasureHourMode || 'auto';
      const isTH = mode === 'on' ? true : (mode === 'off' ? false : sched.active);

      const thBtn = document.getElementById('thBtn');
      const thTxt = document.getElementById('thStatusTxt');
      if (isTH) {
        thBtn.classList.add('active');
        thTxt.textContent = mode === 'auto'
          ? `ATIVA (${formatDurationShort(sched.remainingMs)})`
          : `LIGADA (MANUAL)`;
      } else {
        thBtn.classList.remove('active');
        thTxt.textContent = mode === 'auto'
          ? `SÁB (${formatDurationShort(sched.nextInMs)})`
          : `DESLIGADA`;
      }

      const autoDetected = {
        goldOutfit: false,
        pirateShop: false,
        vehicle: false,
        pickaxe: false,
        jamTrack: false,
        loadingScreen: false,
        gizmosCount: 0
      };

      for (const p of players) {
        if (p.prizes) {
          if (p.prizes.goldOutfit) autoDetected.goldOutfit = true;
          if (p.prizes.pirateShop) autoDetected.pirateShop = true;
          if (p.prizes.vehicle) autoDetected.vehicle = true;
          if (p.prizes.pickaxe) autoDetected.pickaxe = true;
          if (p.prizes.jamTrack) autoDetected.jamTrack = true;
          if (p.prizes.loadingScreen) autoDetected.loadingScreen = true;
          autoDetected.gizmosCount += (p.prizes.gizmosCount || 0);
        }
      }

      const manual = (currentState.manualChecks && currentState.manualChecks.global) || {};

      const isObtained = (key) => {
        if (key === 'gizmo') return false;
        if (typeof manual[key] === 'boolean') return manual[key];
        return !!autoDetected[key];
      };

      let removedProbSum = 0;
      for (const def of PRIZE_DEFS) {
        if (!def.canRepeat && isObtained(def.key)) {
          const effDenom = isTH ? (def.baseDenom / def.thBoost) : def.baseDenom;
          removedProbSum += (1 / effDenom);
        }
      }

      const psDef = PRIZE_DEFS.find(d => d.key === 'pirateShop');
      const psObtained = isObtained('pirateShop');
      const psBaseP = (isTH ? psDef.thBoost : 1) / psDef.baseDenom;
      const psNextP = psObtained ? 1 : (psBaseP / Math.max(0.0001, 1 - removedProbSum));
      const psEffDenom = Math.round(1 / psNextP);

      // Chance de obter a Loja Pirata ao abrir N baús (sob as probabilidades atuais)
      const cumulProb = 1 - Math.pow(1 - psNextP, totalChests);

      document.getElementById('psOddsBadge').textContent = psObtained
        ? 'CONQUISTADO'
        : `1 / ${psEffDenom.toLocaleString('pt-BR')}`;

      document.getElementById('psNextChestPct').textContent = psObtained
        ? '100% (OBTIDO)'
        : `${(psNextP * 100).toFixed(6).replace('.', ',')}%`;

      document.getElementById('psNextChestLbl').textContent = psObtained
        ? 'META CONCLUÍDA'
        : `CHANCE NO PRÓXIMO BAÚ (#${nextChestNumber})`;

      document.getElementById('psCumulPct').textContent = `${(cumulProb * 100).toFixed(4).replace('.', ',')}%`;
      document.getElementById('psChestsUsed').textContent = totalChests.toLocaleString('pt-BR');

      const chkContainer = document.getElementById('checklistContainer');
      chkContainer.innerHTML = PRIZE_DEFS.map(def => {
        const done = isObtained(def.key);
        const effDenom = Math.round(def.baseDenom / (isTH ? def.thBoost : 1));
        const pct = ((1 / effDenom) * 100);
        const pctStr = pct < 0.01 ? pct.toFixed(5) : pct.toFixed(3);

        if (def.canRepeat) {
          return `
            <div class="chk-row" style="cursor:default">
              <div class="chk-box" style="color:var(--muted)">∞</div>
              <div class="chk-name">
                <span>${def.icon}</span>
                <span class="n-txt">${def.name}</span>
                <span class="pill">OBTIDOS: ${autoDetected.gizmosCount}× (REPETE)</span>
              </div>
              <div class="chk-odds">
                <span class="o-main">1 / ${effDenom.toLocaleString('pt-BR')}</span>
                <span class="o-sub">${pctStr.replace('.', ',')}% POR BAÚ</span>
              </div>
            </div>
          `;
        }

        return `
          <div class="chk-row ${done ? 'done' : ''}" onclick="togglePrizeCheck('${def.key}', ${done})">
            <div class="chk-box">${done ? '✓' : ''}</div>
            <div class="chk-name">
              <span>${def.icon}</span>
              <span class="n-txt">${def.name}</span>
              ${isTH && def.thBoost > 1 ? `<span class="pill">BÔNUS ${def.thBoost}×</span>` : ''}
              ${done ? '<span class="pill">OBTIDO</span>' : ''}
            </div>
            <div class="chk-odds">
              <span class="o-main">1 / ${effDenom.toLocaleString('pt-BR')}</span>
              <span class="o-sub">${done ? 'JÁ CONQUISTADO' : `${pctStr.replace('.', ',')}% POR BAÚ`}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      const shareUrl = getShareUrl();
      const dlBtn = document.getElementById('downloadBatBtn');
      if (dlBtn) dlBtn.href = `/api/download-client?server=${encodeURIComponent(shareUrl)}`;

      const players = [...(currentState.players || [])];
      players.sort((a, b) => (b[currentSort] || 0) - (a[currentSort] || 0));

      const totalChests = players.reduce((s, p) => s + (p.totalChests || 0), 0);
      const bestMatch = players.reduce((m, p) => Math.max(m, p.bestMatch || 0), 0);
      const totalTreasures = players.reduce((s, p) => s + (p.treasuresCount || 0), 0);

      document.getElementById('sumTotalChests').textContent = totalChests.toLocaleString('pt-BR');
      document.getElementById('sumBestMatch').textContent = bestMatch;
      document.getElementById('sumTreasures').textContent = totalTreasures;

      renderChecklist(players, totalChests);

      const footerEl = document.getElementById('statusFooter');
      if (footerEl && currentState.updatedAt) {
        const dt = new Date(currentState.updatedAt);
        footerEl.textContent = `${players.length} JOGADOR(ES) · ATUALIZADO ÀS ${dt.toLocaleTimeString('pt-BR')}`;
      }

      const container = document.getElementById('rankingContainer');
      if (players.length === 0) {
        container.innerHTML = `<div class="empty">ABRA O CONNECTR.BAT PARA SINCRONIZAR!</div>`;
        return;
      }

      container.innerHTML = players.map((p, idx) => {
        const rank = idx + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        const isOpen = openDetailsIds.has(p.id);
        const mainMetric = p[currentSort] !== undefined ? p[currentSort] : p.totalChests;
        const lastChests = p.lastMatch ? `ÚLT: <b>${p.lastMatch.chests}</b>` : '';

        return `
          <div>
            <div class="row ${rankClass}" onclick="toggleDetails('${p.id}')">
              <div class="pos">${rank}º</div>
              <div class="p-info">
                <div class="p-top">
                  <span class="p-name">${escapeHtml(p.player)}</span>
                  ${p.inProgress ? '<span class="badge-live">● EM PARTIDA</span>' : ''}
                </div>
                <div class="p-sub">
                  <span>HOJE: <b>${p.todayChests || 0}</b></span>
                  <span>·</span>
                  <span>REC: <b>${p.bestMatch || 0}</b></span>
                  <span>·</span>
                  <span>MÉD: <b>${p.avgChests || 0}</b></span>
                  ${lastChests ? `<span>· ${lastChests}</span>` : ''}
                  ${p.wins ? `<span>· 👑 <b>${p.wins}</b></span>` : ''}
                  ${p.treasuresCount ? `<span>· ★ <b>${p.treasuresCount}</b></span>` : ''}
                </div>
              </div>
              <div class="p-score">
                <span class="main-val">${Number(mainMetric || 0).toLocaleString('pt-BR')}</span>
                <span class="sub-lbl">${sortLabels[currentSort] || 'BAÚS'}</span>
              </div>
            </div>

            <div class="drawer ${isOpen ? 'open' : ''}">
              <div class="drawer-head">
                <span>ÚLTIMAS 5 PARTIDAS (${p.matchesCount || 0} NO TOTAL)</span>
                <span style="cursor:pointer" onclick="removePlayer(event, '${p.id}', '${escapeHtml(p.player)}')">✕ REMOVER</span>
              </div>
              <table class="mini-table">
                <tbody>
                  ${(p.recentMatches || []).slice(0, 5).map(m => `
                    <tr>
                      <td>${escapeHtml((m.date || '').slice(5))}</td>
                      <td>${m.placement === 1 ? '👑 VITÓRIA ROYALE' : `${m.placement}º LUGAR`}</td>
                      <td>${m.treasures ? `★ ${escapeHtml(m.treasures)}` : ''}</td>
                      <td class="c-chests">${m.chests} BAÚS</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('manualFileInput').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const text = await file.text();
      let payload = file.name.endsWith('.json') ? JSON.parse(text) : { matchesCsv: text };
      await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      ev.target.value = '';
    });

    function connectStream() {
      const es = new EventSource('/api/stream');
      es.onmessage = (event) => {
        try {
          currentState = JSON.parse(event.data);
          render();
        } catch (e) {}
      };
      es.onerror = () => {
        es.close();
        setTimeout(connectStream, 3000);
      };
    }

    connectStream();
    setInterval(render, 30000);
  </script>
</body>
</html>
