<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Abrindo Ranking Ao Vivo de Baús...</title>
  <style>
    body {
      background: #0c0d14;
      color: #f1f3f9;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #151722;
      border: 1px solid #272b3f;
      padding: 28px 36px;
      border-radius: 16px;
      max-width: 460px;
    }
    h2 { color: #f5b942; margin: 0 0 10px; }
    p { color: #8b92ad; font-size: 14px; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🧰 Fortnite Chest Ranking</h2>
    <p id="msg">Buscando o endereço atual do servidor ao vivo...</p>
  </div>
  <script>
    async function go() {
      try {
        const res = await fetch('https://ntfy.sh/chestranking_thenutellas_v1/raw?poll=1&since=24h');
        const text = await res.text();
        const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s.startsWith('http'));
        if (lines.length > 0) {
          const latestUrl = lines[lines.length - 1];
          document.getElementById('msg').innerHTML = 'Redirecionando para <a href="' + latestUrl + '">' + latestUrl + '</a>...';
          window.location.replace(latestUrl);
          return;
        }
      } catch (e) {}
      document.getElementById('msg').textContent = 'Servidor offline no momento. Tente novamente em instantes!';
    }
    go();
  </script>
</body>
</html>
